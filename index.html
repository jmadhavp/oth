<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Othello Multiplayer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="app">
<header>
<h1>Othello — Multiplayer</h1>
<div id="status">Connecting...</div>
</header>


<section id="controls">
<div id="lobby">
<input id="playerName" placeholder="Your name (or guest)" />
<button id="createRoom">Create Room</button>
<button id="refreshRooms">Refresh Lobby</button>
<button id="randomJoin">Random Join</button>
<div id="roomsList">Loading rooms...</div>
</div>
<div id="roomLink" class="hidden">
Room: <span id="roomId"></span>
<button id="copyLink">Copy Link</button>
<button id="leaveRoom">Leave</button>
</div>
<div id="options">
<label>Move timer: <input id="moveTimerToggle" type="checkbox" checked /> <span id="timerValue">30s</span></label>
</div>
</section>


<section id="gameArea">
<div id="boardContainer">
<canvas id="board" width="480" height="480"></canvas>
</div>


<aside id="side">
<div id="turnInfo">Turn: —</div>
<div id="players">Players: —</div>
<div id="timer">Timer: —</div>
<div id="chat">
<div id="chatLog"></div>
<input id="chatInput" placeholder="Say something..." />
</div>
</aside>
</section>


<audio id="sndPlace"><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"></audio>


</main>


<!-- Firebase CDN (modules) -->
<script type="module" src="firebase.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
